<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameClips — Хайлайты и Моменты</title>
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #08080a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 0, 60, 0.2);
            --glass-hover: rgba(255, 0, 60, 0.1);
            --accent-color: #ff003c;
            --accent-glow: rgba(255, 0, 60, 0.5);
            --accent-secondary: #990024;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 0, 60, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(153, 0, 36, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* --- Шапка --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(8, 8, 10, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 20px rgba(255, 0, 60, 0.05);
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 1.5px;
        }

        .logo span {
            color: var(--accent-color);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .upload-btn {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .tags-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .tag-pill {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tag-pill:hover, .tag-pill.active {
            background: var(--glass-hover);
            color: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* --- Сетка горизонтальных YouTube-карточек --- */
        .clips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 25px;
        }

        .clip-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .clip-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 0, 60, 0.5);
            box-shadow: 0 10px 30px rgba(255, 0, 60, 0.15);
        }

        /* Горизонтальный формат 16:9 как на YouTube */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            text-shadow: 0 0 15px var(--accent-glow);
            background: rgba(0, 0, 0, 0.4);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clip-card:hover .play-overlay {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(255, 0, 60, 0.6);
        }

        .clip-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .clip-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            color: #fff;
        }

        .clip-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .author {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: var(--text-main);
        }

        .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-color), #330000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: var(--text-main);
        }

        .action-btn.liked {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* --- Страница Просмотра Видео (Full Watch View) --- */
        .watch-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.95);
            backdrop-filter: blur(20px);
            z-index: 300;
            overflow-y: auto;
            padding: 40px 5%;
        }

        .watch-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 30px;
            position: relative;
        }

        @media (max-width: 900px) {
            .watch-container {
                grid-template-columns: 1fr;
            }
        }

        .main-player-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .watch-video-wrapper {
            width: 100%;
            padding-top: 56.25%;
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.2);
        }

        .watch-video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .watch-details {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
        }

        .watch-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .watch-author-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Полноразмерный блок комментариев */
        .watch-comments {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
        }

        .watch-comments h3 {
            font-size: 16px;
            margin-bottom: 15px;
        }

        .watch-comments-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .watch-comment-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 13px;
        }

        .watch-comment-item strong {
            color: var(--accent-color);
        }

        .watch-comment-form {
            display: flex;
            gap: 10px;
        }

        .watch-comment-form input {
            flex-grow: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: #fff;
            outline: none;
        }

        .watch-comment-form button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Боковая колонка других клипов */
        .watch-sidebar h3 {
            font-size: 16px;
            margin-bottom: 15px;
        }

        .sidebar-clips {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-clip-item {
            display: flex;
            gap: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .sidebar-clip-item:hover {
            border-color: var(--accent-color);
        }

        .sidebar-thumb {
            width: 120px;
            height: 68px;
            background: #000;
            position: relative;
            flex-shrink: 0;
        }

        .sidebar-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar-info {
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .sidebar-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .close-watch-btn {
            position: fixed;
            top: 25px;
            right: 40px;
            background: var(--accent-color);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            z-index: 310;
        }

        /* --- Модальное окно загрузки --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(15, 15, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            width: 90%;
            max-width: 450px;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(255, 0, 60, 0.2);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .modal h2 { margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
        .form-group input[type="text"] { width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); outline: none; }
        .form-group select { width: 100%; padding: 12px 16px; background-color: #121216; border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); outline: none; cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg fill='%23ff003c' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; }
        .form-group select option { background-color: #121216; color: #ffffff; }
        .file-upload-wrapper input[type="file"] { display: none; }
        .file-upload-label { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; background: rgba(255, 255, 255, 0.04); border: 1px dashed var(--glass-border); border-radius: 12px; color: var(--text-muted); cursor: pointer; }
        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary)); border: none; border-radius: 12px; color: #ffffff; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; box-shadow: 0 0 15px var(--accent-glow); }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <a href="#" class="logo">
            <i class="fa-solid fa-fire-flame-curved" style="color: var(--accent-color);"></i> GAME<span>CLIPS</span>
        </a>

        <!-- Поиск -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Поиск видео..." oninput="handleSearch()">
        </div>

        <button class="upload-btn" onclick="openModal()">
            <i class="fa-solid fa-plus"></i> Загрузить клип
        </button>
    </header>

    <!-- Основной контент -->
    <div class="container">
        <!-- Фильтры -->
        <div class="tags-nav">
            <div class="tag-pill active" onclick="filterClips('all', this)">Все клипы</div>
            <div class="tag-pill" onclick="filterClips('эпик', this)">🔥 #эпик</div>
            <div class="tag-pill" onclick="filterClips('баги', this)">😂 #баги</div>
            <div class="tag-pill" onclick="filterClips('соло', this)">⚔️ #соло</div>
            <div class="tag-pill" onclick="filterClips('скилл', this)">🎯 #скилл</div>
        </div>

        <!-- Лента карточек -->
        <div class="clips-grid" id="clipsContainer"></div>
    </div>

    <!-- Полноэкранная страница просмотра клипа (Watch View) -->
    <div class="watch-modal" id="watchModal">
        <button class="close-watch-btn" onclick="closeWatchView()"><i class="fa-solid fa-xmark"></i></button>
        
        <div class="watch-container">
            <!-- Основное видео и детали -->
            <div class="main-player-box">
                <div class="watch-video-wrapper">
                    <video id="watchVideoPlayer" controls autoplay></video>
                </div>
                
                <div class="watch-details">
                    <div class="watch-title" id="watchTitle">---</div>
                    <div class="watch-author-bar">
                        <div class="author">
                            <div class="avatar" id="watchAvatar">U</div>
                            <span id="watchAuthor">---</span>
                        </div>
                        <div id="watchMeta" style="color: var(--text-muted); font-size: 13px;">---</div>
                    </div>
                    <div class="actions">
                        <button class="action-btn" id="watchLikeBtn" onclick="toggleLikeInWatch()">
                            <i class="fa-regular fa-heart"></i> <span id="watchLikesCount">0</span>
                        </button>
                        <button class="action-btn" onclick="shareClip('текущий клип')">
                            <i class="fa-regular fa-share-from-square"></i> Поделиться
                        </button>
                    </div>
                </div>

                <!-- Блок комментариев -->
                <div class="watch-comments">
                    <h3>Комментарии (<span id="watchCommentsCount">0</span>)</h3>
                    <div class="watch-comments-list" id="watchCommentsList"></div>
                    <div class="watch-comment-form">
                        <input type="text" id="watchCommentInput" placeholder="Напишите комментарий...">
                        <button onclick="addCommentInWatch()">Отправить</button>
                    </div>
                </div>
            </div>

            <!-- Рекомендации справа -->
            <div class="watch-sidebar">
                <h3>Другие клипы</h3>
                <div class="sidebar-clips" id="sidebarClips"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно загрузки -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2>Опубликовать момент</h2>
            <form id="uploadForm" onsubmit="handleUpload(event)">
                <div class="form-group">
                    <label>Выберите видеофайл (.mp4)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="videoFile" accept="video/*" required onchange="updateFileName(this)">
                        <label for="videoFile" class="file-upload-label">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span id="fileNameText">Нажмите для выбора видео</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Название видео</label>
                    <input type="text" id="videoTitle" placeholder="Например: Минус 5 на точке B!" required>
                </div>
                <div class="form-group">
                    <label>Категория / Тег</label>
                    <select id="videoTag">
                        <option value="эпик">🔥 #эпик</option>
                        <option value="баги">😂 #баги</option>
                        <option value="соло">⚔️ #соло</option>
                        <option value="скилл">🎯 #скилл</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Опубликовать</button>
            </form>
        </div>
    </div>

    <!-- Скрипты -->
    <script>
        let clips = [
            {
                id: 1,
                title: "Невероятный прострел через всю карту!",
                author: "ProGamer99",
                tag: "скилл",
                likes: 42,
                views: 310,
                isLiked: false,
                comments: ["Жесть прострел!", "Учись, бот!"],
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-game-animation-of-a-robot-character-42964-large.mp4"
            },
            {
                id: 2,
                title: "Физика игры снова сломалась 🤣",
                author: "BugHunter",
                tag: "баги",
                likes: 128,
                views: 890,
                isLiked: false,
                comments: ["Разрабы почините!"],
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-player-losing-a-video-game-40320-large.mp4"
            },
            {
                id: 3,
                title: "Соло затащил раунд на последних секундах!",
                author: "NinjaShadow",
                tag: "эпик",
                likes: 89,
                views: 540,
                isLiked: false,
                comments: ["Эпик момент!"],
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-controller-while-playing-a-video-game-41553-large.mp4"
            }
        ];

        let currentFilter = 'all';
        let searchQuery = '';
        let activeWatchClipId = null;

        function renderClips() {
            const container = document.getElementById('clipsContainer');
            container.innerHTML = '';

            const filteredClips = clips.filter(c => {
                const matchesTag = currentFilter === 'all' || c.tag === currentFilter;
                const matchesSearch = c.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesTag && matchesSearch;
            });

            filteredClips.forEach(clip => {
                const card = document.createElement('div');
                card.className = 'clip-card';
                card.onclick = () => openWatchView(clip.id);
                card.innerHTML = `
                    <div class="video-wrapper">
                        <video preload="metadata" muted>
                            <source src="${clip.videoUrl}" type="video/mp4">
                        </video>
                        <div class="play-overlay"><i class="fa-solid fa-play"></i></div>
                    </div>
                    <div class="clip-info">
                        <div class="clip-title">${escapeHtml(clip.title)}</div>
                        <div class="clip-meta">
                            <div class="author">
                                <div class="avatar">${clip.author[0].toUpperCase()}</div>
                                ${escapeHtml(clip.author)}
                            </div>
                            <span>#${clip.tag} • <i class="fa-regular fa-eye"></i> ${clip.views}</span>
                        </div>
                        <div class="actions" onclick="event.stopPropagation()">
                            <button class="action-btn ${clip.isLiked ? 'liked' : ''}" onclick="toggleLike(${clip.id})">
                                <i class="${clip.isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i> 
                                <span>${clip.likes}</span>
                            </button>
                            <button class="action-btn" onclick="openWatchView(${clip.id})">
                                <i class="fa-regular fa-comment"></i> ${clip.comments.length}
                            </button>
                            <button class="action-btn" onclick="shareClip('${escapeHtml(clip.title)}')">
                                <i class="fa-regular fa-share-from-square"></i>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- Открытие клипа на отдельном экране ---
        function openWatchView(clipId) {
            const clip = clips.find(c => c.id === clipId);
            if (!clip) return;

            activeWatchClipId = clipId;
            clip.views++; // Считаем просмотр

            document.getElementById('watchTitle').textContent = clip.title;
            document.getElementById('watchAuthor').textContent = clip.author;
            document.getElementById('watchAvatar').textContent = clip.author[0].toUpperCase();
            document.getElementById('watchMeta').textContent = `#${clip.tag} • ${clip.views} просмотров`;
            document.getElementById('watchLikesCount').textContent = clip.likes;

            const player = document.getElementById('watchVideoPlayer');
            player.src = clip.videoUrl;

            // Обновляем лайк-кнопку
            const likeBtn = document.getElementById('watchLikeBtn');
            likeBtn.className = `action-btn ${clip.isLiked ? 'liked' : ''}`;
            likeBtn.querySelector('i').className = `${clip.isLiked ? 'fa-solid' : 'fa-regular'} fa-heart`;

            renderWatchComments();
            renderSidebarClips();

            document.getElementById('watchModal').style.display = 'block';
            document.body.style.overflow = 'hidden'; // замок скролла
            renderClips();
        }

        function closeWatchView() {
            const player = document.getElementById('watchVideoPlayer');
            player.pause();
            player.src = '';
            document.getElementById('watchModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            activeWatchClipId = null;
        }

        function renderWatchComments() {
            const clip = clips.find(c => c.id === activeWatchClipId);
            if (!clip) return;

            document.getElementById('watchCommentsCount').textContent = clip.comments.length;
            const container = document.getElementById('watchCommentsList');
            container.innerHTML = clip.comments.map(c => `
                <div class="watch-comment-item">
                    <strong>Игрок:</strong> ${escapeHtml(c)}
                </div>
            `).join('');
        }

        function addCommentInWatch() {
            const input = document.getElementById('watchCommentInput');
            const text = input.value.trim();
            if (text && activeWatchClipId) {
                const clip = clips.find(c => c.id === activeWatchClipId);
                if (clip) {
                    clip.comments.push(text);
                    input.value = '';
                    renderWatchComments();
                    renderClips();
                }
            }
        }

        function toggleLikeInWatch() {
            if (activeWatchClipId) {
                toggleLike(activeWatchClipId);
                const clip = clips.find(c => c.id === activeWatchClipId);
                document.getElementById('watchLikesCount').textContent = clip.likes;
                const likeBtn = document.getElementById('watchLikeBtn');
                likeBtn.className = `action-btn ${clip.isLiked ? 'liked' : ''}`;
                likeBtn.querySelector('i').className = `${clip.isLiked ? 'fa-solid' : 'fa-regular'} fa-heart`;
            }
        }

        function renderSidebarClips() {
            const container = document.getElementById('sidebarClips');
            container.innerHTML = '';

            const otherClips = clips.filter(c => c.id !== activeWatchClipId);
            otherClips.forEach(clip => {
                const item = document.createElement('div');
                item.className = 'sidebar-clip-item';
                item.onclick = () => openWatchView(clip.id);
                item.innerHTML = `
                    <div class="sidebar-thumb">
                        <video src="${clip.videoUrl}" muted></video>
                    </div>
                    <div class="sidebar-info">
                        <div class="sidebar-title">${escapeHtml(clip.title)}</div>
                        <div class="sidebar-meta">${escapeHtml(clip.author)} • #${clip.tag}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleLike(id) {
            const clip = clips.find(c => c.id === id);
            if (clip) {
                clip.isLiked = !clip.isLiked;
                clip.likes += clip.isLiked ? 1 : -1;
                renderClips();
            }
        }

        function filterClips(tag, element) {
            currentFilter = tag;
            document.querySelectorAll('.tag-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            renderClips();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            renderClips();
        }

        function openModal() {
            document.getElementById('uploadModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('uploadModal').style.display = 'none';
        }

        function updateFileName(input) {
            const label = document.getElementById('fileNameText');
            if (input.files && input.files[0]) {
                label.textContent = input.files[0].name;
            } else {
                label.textContent = "Нажмите для выбора видео";
            }
        }

        function handleUpload(event) {
            event.preventDefault();
            const fileInput = document.getElementById('videoFile');
            const titleInput = document.getElementById('videoTitle');
            const tagInput = document.getElementById('videoTag');

            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const videoObjectUrl = URL.createObjectURL(file);

                const newClip = {
                    id: Date.now(),
                    title: titleInput.value,
                    author: "Ты (Игрок)",
                    tag: tagInput.value,
                    likes: 0,
                    views: 1,
                    isLiked: false,
                    comments: [],
                    videoUrl: videoObjectUrl
                };

                clips.unshift(newClip);
                renderClips();
                closeModal();
                event.target.reset();
                document.getElementById('fileNameText').textContent = "Нажмите для выбора видео";
            }
        }

        function shareClip(title) {
            alert(`Ссылка на клип "${title}" скопирована!`);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        renderClips();
    </script>
</body>
</html>
