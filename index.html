<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameClips — Хайлайты и Профиль Игрока</title>
    <!-- Иконки FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #08080a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 0, 60, 0.2);
            --glass-hover: rgba(255, 0, 60, 0.1);
            --accent-color: #ff003c;
            --accent-glow: rgba(255, 0, 60, 0.5);
            --accent-secondary: #990024;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 0, 60, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(153, 0, 36, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* --- Шапка --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(8, 8, 10, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 1.5px;
            cursor: pointer;
        }

        .logo span {
            color: var(--accent-color);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .upload-btn {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        /* Аватар в шапке / Кнопка входа */
        .user-profile-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 6px 14px 6px 6px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-profile-btn:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-color), #330000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .tags-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .tag-pill {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tag-pill:hover, .tag-pill.active {
            background: var(--glass-hover);
            color: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* --- Сетка клипов --- */
        .clips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }

        .clip-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .clip-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 0, 60, 0.5);
            box-shadow: 0 10px 30px rgba(255, 0, 60, 0.15);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .clip-card:hover .play-overlay {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(255, 0, 60, 0.7);
        }

        .clip-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .clip-title { font-size: 15px; font-weight: 600; line-height: 1.4; color: #fff; }
        .clip-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); }
        .author { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--text-main); }
        .avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(45deg, var(--accent-color), #330000); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .action-btn {
            background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.2s;
        }
        .action-btn:hover { color: var(--text-main); }
        .action-btn.liked { color: var(--accent-color); text-shadow: 0 0 10px var(--accent-glow); }

        /* --- Страница Просмотра (Watch View) --- */
        .watch-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(20px); z-index: 300; overflow-y: auto; padding: 40px 5%;
        }
        .watch-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 340px; gap: 30px; }
        @media (max-width: 900px) { .watch-container { grid-template-columns: 1fr; } }
        .main-player-box { display: flex; flex-direction: column; gap: 15px; }
        .watch-video-wrapper { width: 100%; padding-top: 56.25%; position: relative; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid var(--glass-border); box-shadow: 0 0 30px rgba(255, 0, 60, 0.2); }
        .watch-video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .watch-details, .watch-comments { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; }
        .watch-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
        .watch-author-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .watch-comments-list { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; margin: 15px 0; }
        .watch-comment-item { padding: 10px; background: rgba(255, 255, 255, 0.03); border-radius: 8px; font-size: 13px; }
        .watch-comment-item strong { color: var(--accent-color); }
        .watch-comment-form { display: flex; gap: 10px; }
        .watch-comment-form input { flex-grow: 1; padding: 10px 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; outline: none; }
        .watch-comment-form button { background: var(--accent-color); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .watch-sidebar h3 { font-size: 16px; margin-bottom: 15px; }
        .sidebar-clips { display: flex; flex-direction: column; gap: 12px; }
        .sidebar-clip-item { display: flex; gap: 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 10px; overflow: hidden; cursor: pointer; }
        .sidebar-thumb { width: 120px; height: 68px; background: #000; flex-shrink: 0; }
        .sidebar-thumb video { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-info { padding: 6px 8px; display: flex; flex-direction: column; justify-content: center; }
        .sidebar-title { font-size: 12px; font-weight: 600; line-height: 1.3; }
        .sidebar-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .close-watch-btn { position: fixed; top: 25px; right: 40px; background: var(--accent-color); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: 0 0 15px var(--accent-glow); z-index: 310; }

        /* --- Личный Кабинет / Профиль Игрока (Profile Modal) --- */
        .profile-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.95); backdrop-filter: blur(20px); z-index: 250; overflow-y: auto; padding: 40px 5%;
        }

        .profile-header {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            gap: 25px;
            position: relative;
        }

        .profile-avatar-large {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-color), #550000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 0 20px var(--accent-glow);
            border: 2px solid var(--accent-color);
        }

        .profile-details h2 { font-size: 26px; margin-bottom: 5px; }
        .profile-details p { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; }

        .profile-stats {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 18px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value { font-size: 18px; font-weight: 700; color: var(--accent-color); }
        .stat-label { font-size: 12px; color: var(--text-muted); }

        .logout-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255, 0, 60, 0.15);
            border: 1px solid var(--accent-color);
            color: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .logout-btn:hover { background: var(--accent-color); box-shadow: 0 0 12px var(--accent-glow); }

        .profile-content { max-width: 1000px; margin: 0 auto; }
        .profile-tabs { display: flex; gap: 15px; border-bottom: 1px solid var(--glass-border); margin-bottom: 25px; padding-bottom: 10px; }
        .profile-tab { background: none; border: none; color: var(--text-muted); font-size: 16px; font-weight: 600; cursor: pointer; padding: 6px 12px; transition: color 0.2s; }
        .profile-tab.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); }

        /* --- Общие модальные окна (Загрузка & Авторизация) --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); z-index: 400; justify-content: center; align-items: center; }
        .modal-content { background: rgba(15, 15, 20, 0.95); border: 1px solid var(--glass-border); width: 90%; max-width: 420px; border-radius: 24px; padding: 30px; box-shadow: 0 0 40px rgba(255, 0, 60, 0.2); position: relative; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
        .modal h2 { margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); }
        .form-group input[type="text"], .form-group input[type="password"] { width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); outline: none; }
        .form-group select { width: 100%; padding: 12px 16px; background-color: #121216; border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); outline: none; }
        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary)); border: none; border-radius: 12px; color: #ffffff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; box-shadow: 0 0 15px var(--accent-glow); }
        .file-upload-label { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; background: rgba(255, 255, 255, 0.04); border: 1px dashed var(--glass-border); border-radius: 12px; color: var(--text-muted); cursor: pointer; }
        .file-upload-wrapper input[type="file"] { display: none; }
        .auth-switch { margin-top: 15px; text-align: center; font-size: 13px; color: var(--text-muted); }
        .auth-switch span { color: var(--accent-color); cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo" onclick="showMainFeed()">
            <i class="fa-solid fa-fire-flame-curved" style="color: var(--accent-color);"></i> GAME<span>CLIPS</span>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Поиск видео..." oninput="handleSearch()">
        </div>

        <div class="header-actions">
            <button class="upload-btn" onclick="openUploadModal()">
                <i class="fa-solid fa-plus"></i> Опубликовать
            </button>
            <div class="user-profile-btn" id="userHeaderBtn" onclick="handleUserBtnClick()">
                <div class="user-avatar" id="headerAvatar"><i class="fa-solid fa-user"></i></div>
                <span id="headerUserName" style="font-size: 14px; font-weight: 600;">Войти</span>
            </div>
        </div>
    </header>

    <!-- Основной контент (Лента) -->
    <div class="container" id="mainContainer">
        <div class="tags-nav">
            <div class="tag-pill active" onclick="filterClips('all', this)">Все клипы</div>
            <div class="tag-pill" onclick="filterClips('эпик', this)">🔥 #эпик</div>
            <div class="tag-pill" onclick="filterClips('баги', this)">😂 #баги</div>
            <div class="tag-pill" onclick="filterClips('соло', this)">⚔️ #соло</div>
            <div class="tag-pill" onclick="filterClips('скилл', this)">🎯 #скилл</div>
        </div>

        <div class="clips-grid" id="clipsContainer"></div>
    </div>

    <!-- Страница Кабинета / Профиля Игрока -->
    <div class="profile-modal" id="profileModal">
        <button class="close-watch-btn" onclick="closeProfile()"><i class="fa-solid fa-xmark"></i></button>

        <div class="profile-header">
            <div class="profile-avatar-large" id="profileAvatarLarge">U</div>
            <div class="profile-details">
                <h2 id="profileName">Никнейм</h2>
                <p id="profileHandle">@player</p>
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="statMyClips">0</div>
                        <div class="stat-label">Клипов</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="statTotalLikes">0</div>
                        <div class="stat-label">Лайков</div>
                    </div>
                </div>
            </div>
            <button class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Выйти</button>
        </div>

        <div class="profile-content">
            <div class="profile-tabs">
                <button class="profile-tab active" id="tabMyClipsBtn" onclick="switchProfileTab('myClips')">Мои клипы</button>
                <button class="profile-tab" id="tabLikedBtn" onclick="switchProfileTab('liked')">Понравилось ❤️</button>
            </div>
            <div class="clips-grid" id="profileClipsGrid"></div>
        </div>
    </div>

    <!-- Полноэкранный просмотр видео (Watch View) -->
    <div class="watch-modal" id="watchModal">
        <button class="close-watch-btn" onclick="closeWatchView()"><i class="fa-solid fa-xmark"></i></button>
        <div class="watch-container">
            <div class="main-player-box">
                <div class="watch-video-wrapper">
                    <video id="watchVideoPlayer" controls autoplay></video>
                </div>
                <div class="watch-details">
                    <div class="watch-title" id="watchTitle">---</div>
                    <div class="watch-author-bar">
                        <div class="author">
                            <div class="avatar" id="watchAvatar">U</div>
                            <span id="watchAuthor">---</span>
                        </div>
                        <div id="watchMeta" style="color: var(--text-muted); font-size: 13px;">---</div>
                    </div>
                    <div class="actions">
                        <button class="action-btn" id="watchLikeBtn" onclick="toggleLikeInWatch()">
                            <i class="fa-regular fa-heart"></i> <span id="watchLikesCount">0</span>
                        </button>
                        <button class="action-btn" onclick="shareClip('текущий клип')">
                            <i class="fa-regular fa-share-from-square"></i> Поделиться
                        </button>
                    </div>
                </div>

                <div class="watch-comments">
                    <h3>Комментарии (<span id="watchCommentsCount">0</span>)</h3>
                    <div class="watch-comments-list" id="watchCommentsList"></div>
                    <div class="watch-comment-form">
                        <input type="text" id="watchCommentInput" placeholder="Напишите комментарий...">
                        <button onclick="addCommentInWatch()">Отправить</button>
                    </div>
                </div>
            </div>

            <div class="watch-sidebar">
                <h3>Другие клипы</h3>
                <div class="sidebar-clips" id="sidebarClips"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно Авторизации / Регистрации -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeAuthModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2 id="authTitle">Вход в GameClips</h2>
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <div class="form-group">
                    <label>Никнейм игрока</label>
                    <input type="text" id="authUsername" placeholder="Например: CyberKnight" required>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="authPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn" id="authSubmitBtn">Войти</button>
            </form>
            <div class="auth-switch">
                <span id="authSwitchText" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</span>
            </div>
        </div>
    </div>

    <!-- Модальное окно Загрузки Клипа -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2>Опубликовать момент</h2>
            <form id="uploadForm" onsubmit="handleUpload(event)">
                <div class="form-group">
                    <label>Выберите видеофайл (.mp4)</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="videoFile" accept="video/*" required onchange="updateFileName(this)">
                        <label for="videoFile" class="file-upload-label">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span id="fileNameText">Нажмите для выбора видео</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Название видео</label>
                    <input type="text" id="videoTitle" placeholder="Например: Минус 5 на точке B!" required>
                </div>
                <div class="form-group">
                    <label>Категория / Тег</label>
                    <select id="videoTag">
                        <option value="эпик">🔥 #эпик</option>
                        <option value="баги">😂 #баги</option>
                        <option value="соло">⚔️ #соло</option>
                        <option value="скилл">🎯 #скилл</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Опубликовать</button>
            </form>
        </div>
    </div>

    <script>
        /* ==========================================
           1. ДАННЫЕ И СОСТОЯНИЕ (LOCALSTORAGE / FIREBASE READY)
           ========================================== */
        
        let currentUser = JSON.parse(localStorage.getItem('gameclips_user')) || null;

        let clips = JSON.parse(localStorage.getItem('gameclips_data')) || [
            {
                id: 1,
                title: "Невероятный прострел через всю карту!",
                author: "ProGamer99",
                tag: "скилл",
                likes: 42,
                views: 310,
                likedBy: [],
                comments: [
                    { author: "HardSkill", text: "Жесть прострел!" },
                    { author: "ProGamer99", text: "Спасибо!" }
                ],
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-game-animation-of-a-robot-character-42964-large.mp4"
            },
            {
                id: 2,
                title: "Физика игры снова сломалась 🤣",
                author: "BugHunter",
                tag: "баги",
                likes: 128,
                views: 890,
                likedBy: [],
                comments: [{ author: "Noob2000", text: "Разрабы почините!" }],
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-player-losing-a-video-game-40320-large.mp4"
            },
            {
                id: 3,
                title: "Соло затащил раунд на последних секундах!",
                author: "NinjaShadow",
                tag: "эпик",
                likes: 89,
                views: 540,
                likedBy: [],
                comments: [{ author: "Ghost", text: "Эпик момент!" }],
                videoUrl: "https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-controller-while-playing-a-video-game-41553-large.mp4"
            }
        ];

        let currentFilter = 'all';
        let searchQuery = '';
        let activeWatchClipId = null;
        let isAuthRegisterMode = false;
        let currentProfileTab = 'myClips';

        function saveData() {
            localStorage.setItem('gameclips_data', JSON.stringify(clips));
        }

        function saveUser() {
            if (currentUser) {
                localStorage.setItem('gameclips_user', JSON.stringify(currentUser));
            } else {
                localStorage.removeItem('gameclips_user');
            }
            updateHeaderUserUI();
        }

        /* ==========================================
           2. РЕНДЕР ЛЕНТЫ КЛИПОВ
           ========================================== */

        function renderClips() {
            const container = document.getElementById('clipsContainer');
            container.innerHTML = '';

            const filtered = clips.filter(c => {
                const matchesTag = currentFilter === 'all' || c.tag === currentFilter;
                const matchesSearch = c.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesTag && matchesSearch;
            });

            filtered.forEach(clip => {
                container.appendChild(createClipCard(clip));
            });
        }

        function createClipCard(clip) {
            const isLiked = currentUser && clip.likedBy.includes(currentUser.username);
            const card = document.createElement('div');
            card.className = 'clip-card';
            card.onclick = () => openWatchView(clip.id);
            card.innerHTML = `
                <div class="video-wrapper">
                    <video preload="metadata" muted>
                        <source src="${clip.videoUrl}" type="video/mp4">
                    </video>
                    <div class="play-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
                <div class="clip-info">
                    <div class="clip-title">${escapeHtml(clip.title)}</div>
                    <div class="clip-meta">
                        <div class="author">
                            <div class="avatar">${clip.author[0].toUpperCase()}</div>
                            ${escapeHtml(clip.author)}
                        </div>
                        <span>#${clip.tag} • <i class="fa-regular fa-eye"></i> ${clip.views}</span>
                    </div>
                    <div class="actions" onclick="event.stopPropagation()">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${clip.id})">
                            <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i> 
                            <span>${clip.likes}</span>
                        </button>
                        <button class="action-btn" onclick="openWatchView(${clip.id})">
                            <i class="fa-regular fa-comment"></i> ${clip.comments.length}
                        </button>
                        <button class="action-btn" onclick="shareClip('${escapeHtml(clip.title)}')">
                            <i class="fa-regular fa-share-from-square"></i>
                        </button>
                    </div>
                </div>
            `;
            return card;
        }

        /* ==========================================
           3. РЕЖИМ ПРОСМОТРА КЛИПА (WATCH VIEW)
           ========================================== */

        function openWatchView(clipId) {
            const clip = clips.find(c => c.id === clipId);
            if (!clip) return;

            activeWatchClipId = clipId;
            clip.views++;
            saveData();

            document.getElementById('watchTitle').textContent = clip.title;
            document.getElementById('watchAuthor').textContent = clip.author;
            document.getElementById('watchAvatar').textContent = clip.author[0].toUpperCase();
            document.getElementById('watchMeta').textContent = `#${clip.tag} • ${clip.views} просмотров`;
            document.getElementById('watchLikesCount').textContent = clip.likes;

            const player = document.getElementById('watchVideoPlayer');
            player.src = clip.videoUrl;

            updateWatchLikeBtnState(clip);
            renderWatchComments();
            renderSidebarClips();

            document.getElementById('watchModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
            renderClips();
        }

        function closeWatchView() {
            const player = document.getElementById('watchVideoPlayer');
            player.pause();
            player.src = '';
            document.getElementById('watchModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            activeWatchClipId = null;
        }

        function updateWatchLikeBtnState(clip) {
            const isLiked = currentUser && clip.likedBy.includes(currentUser.username);
            const likeBtn = document.getElementById('watchLikeBtn');
            likeBtn.className = `action-btn ${isLiked ? 'liked' : ''}`;
            likeBtn.querySelector('i').className = `${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart`;
            document.getElementById('watchLikesCount').textContent = clip.likes;
        }

        function renderWatchComments() {
            const clip = clips.find(c => c.id === activeWatchClipId);
            if (!clip) return;

            document.getElementById('watchCommentsCount').textContent = clip.comments.length;
            const container = document.getElementById('watchCommentsList');
            container.innerHTML = clip.comments.map(c => `
                <div class="watch-comment-item">
                    <strong>${escapeHtml(c.author)}:</strong> ${escapeHtml(c.text)}
                </div>
            `).join('');
        }

        function addCommentInWatch() {
            if (!currentUser) {
                alert("Пожалуйста, войдите в аккаунт, чтобы оставлять комментарии!");
                openAuthModal();
                return;
            }

            const input = document.getElementById('watchCommentInput');
            const text = input.value.trim();
            if (text && activeWatchClipId) {
                const clip = clips.find(c => c.id === activeWatchClipId);
                if (clip) {
                    clip.comments.push({ author: currentUser.username, text: text });
                    saveData();
                    input.value = '';
                    renderWatchComments();
                    renderClips();
                }
            }
        }

        function toggleLikeInWatch() {
            if (activeWatchClipId) {
                toggleLike(activeWatchClipId);
                const clip = clips.find(c => c.id === activeWatchClipId);
                updateWatchLikeBtnState(clip);
            }
        }

        function renderSidebarClips() {
            const container = document.getElementById('sidebarClips');
            container.innerHTML = '';
            const otherClips = clips.filter(c => c.id !== activeWatchClipId);
            otherClips.forEach(clip => {
                const item = document.createElement('div');
                item.className = 'sidebar-clip-item';
                item.onclick = () => openWatchView(clip.id);
                item.innerHTML = `
                    <div class="sidebar-thumb"><video src="${clip.videoUrl}" muted></video></div>
                    <div class="sidebar-info">
                        <div class="sidebar-title">${escapeHtml(clip.title)}</div>
                        <div class="sidebar-meta">${escapeHtml(clip.author)} • #${clip.tag}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        /* ==========================================
           4. ЛИЧНЫЙ КАБИНЕТ И ПОЛЬЗОВАТЕЛИ (PROFILE)
           ========================================== */

        function updateHeaderUserUI() {
            const avatar = document.getElementById('headerAvatar');
            const nameSpan = document.getElementById('headerUserName');

            if (currentUser) {
                avatar.textContent = currentUser.username[0].toUpperCase();
                nameSpan.textContent = currentUser.username;
            } else {
                avatar.innerHTML = '<i class="fa-solid fa-user"></i>';
                nameSpan.textContent = 'Войти';
            }
        }

        function handleUserBtnClick() {
            if (currentUser) {
                openProfile();
            } else {
                openAuthModal();
            }
        }

        function openProfile() {
            if (!currentUser) return;

            document.getElementById('profileName').textContent = currentUser.username;
            document.getElementById('profileHandle').textContent = `@${currentUser.username.toLowerCase()}`;
            document.getElementById('profileAvatarLarge').textContent = currentUser.username[0].toUpperCase();

            updateProfileStats();
            renderProfileClips();

            document.getElementById('profileModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeProfile() {
            document.getElementById('profileModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function updateProfileStats() {
            const myClips = clips.filter(c => c.author === currentUser.username);
            const totalLikes = myClips.reduce((acc, c) => acc + c.likes, 0);

            document.getElementById('statMyClips').textContent = myClips.length;
            document.getElementById('statTotalLikes').textContent = totalLikes;
        }

        function switchProfileTab(tab) {
            currentProfileTab = tab;
            document.getElementById('tabMyClipsBtn').classList.toggle('active', tab === 'myClips');
            document.getElementById('tabLikedBtn').classList.toggle('active', tab === 'liked');
            renderProfileClips();
        }

        function renderProfileClips() {
            const container = document.getElementById('profileClipsGrid');
            container.innerHTML = '';

            let list = [];
            if (currentProfileTab === 'myClips') {
                list = clips.filter(c => c.author === currentUser.username);
            } else {
                list = clips.filter(c => c.likedBy.includes(currentUser.username));
            }

            if (list.length === 0) {
                container.innerHTML = `<div style="color: var(--text-muted); padding: 20px;">Нет доступных клипов.</div>`;
                return;
            }

            list.forEach(clip => {
                container.appendChild(createClipCard(clip));
            });
        }

        /* ==========================================
           5. АВТОРИЗАЦИЯ & ВХОД (FIREBASE INTEGRATION READY)
           ========================================== */

        function openAuthModal() {
            document.getElementById('authModal').style.display = 'flex';
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        function toggleAuthMode() {
            isAuthRegisterMode = !isAuthRegisterMode;
            document.getElementById('authTitle').textContent = isAuthRegisterMode ? "Регистрация Игрока" : "Вход в GameClips";
            document.getElementById('authSubmitBtn').textContent = isAuthRegisterMode ? "Зарегистрироваться" : "Войти";
            document.getElementById('authSwitchText').textContent = isAuthRegisterMode ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('authUsername').value.trim();
            
            /* === ПРИМЕЧАНИЕ ДЛЯ FIREBASE ===
               Если ты решишь подключить настоящую БД Firebase, 
               здесь будет вызываться: firebase.auth().signInWithEmailAndPassword(...) 
               или firebase.auth().createUserWithEmailAndPassword(...)
            ================================== */

            if (username) {
                currentUser = { username: username };
                saveUser();
                closeAuthModal();
                alert(`Добро пожаловать, ${username}!`);
                renderClips();
            }
        }

        function logout() {
            currentUser = null;
            saveUser();
            closeProfile();
            renderClips();
        }

        /* ==========================================
           6. ЛАЙКИ И ПУБЛИКАЦИЯ
           ========================================== */

        function toggleLike(id) {
            if (!currentUser) {
                alert("Войдите в аккаунт, чтобы ставить лайки!");
                openAuthModal();
                return;
            }

            const clip = clips.find(c => c.id === id);
            if (clip) {
                const userIndex = clip.likedBy.indexOf(currentUser.username);
                if (userIndex === -1) {
                    clip.likedBy.push(currentUser.username);
                    clip.likes++;
                } else {
                    clip.likedBy.splice(userIndex, 1);
                    clip.likes--;
                }
                saveData();
                renderClips();
                if (document.getElementById('profileModal').style.display === 'block') {
                    renderProfileClips();
                    updateProfileStats();
                }
            }
        }

        function openUploadModal() {
            if (!currentUser) {
                alert("Чтобы загружать клипы, войдите в профиль!");
                openAuthModal();
                return;
            }
            document.getElementById('uploadModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('uploadModal').style.display = 'none';
        }

        function updateFileName(input) {
            const label = document.getElementById('fileNameText');
            label.textContent = (input.files && input.files[0]) ? input.files[0].name : "Нажмите для выбора видео";
        }

        function handleUpload(event) {
            event.preventDefault();
            const fileInput = document.getElementById('videoFile');
            const titleInput = document.getElementById('videoTitle');
            const tagInput = document.getElementById('videoTag');

            if (fileInput.files && fileInput.files[0]) {
                const videoObjectUrl = URL.createObjectURL(fileInput.files[0]);

                const newClip = {
                    id: Date.now(),
                    title: titleInput.value,
                    author: currentUser ? currentUser.username : "Аноним",
                    tag: tagInput.value,
                    likes: 0,
                    views: 1,
                    likedBy: [],
                    comments: [],
                    videoUrl: videoObjectUrl
                };

                clips.unshift(newClip);
                saveData();
                renderClips();
                closeModal();
                event.target.reset();
                document.getElementById('fileNameText').textContent = "Нажмите для выбора видео";
            }
        }

        function filterClips(tag, element) {
            currentFilter = tag;
            document.querySelectorAll('.tag-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            renderClips();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            renderClips();
        }

        function shareClip(title) {
            alert(`Ссылка на клип "${title}" скопирована в буфер обмена!`);
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Инициализация
        updateHeaderUserUI();
        renderClips();
    </script>
</body>
</html>
