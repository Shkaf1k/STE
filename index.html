<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TTK - Tactical Menu</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #08080a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; color: #fff; }
        
        /* 3D Фон */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* Оверлей меню */
        #menu-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            display: flex; flex-direction: column; justify-content: space-between; padding: 40px;
            background: linear-gradient(90deg, rgba(8,8,10,0.85) 0%, rgba(8,8,10,0.3) 50%, rgba(8,8,10,0.7) 100%);
        }

        /* Шапка */
        .header { display: flex; justify-content: space-between; align-items: center; }
        .title-group h1 { margin: 0; font-size: 32px; letter-spacing: 2px; text-transform: uppercase; font-weight: 900; }
        .title-group .badge { background: #0066ff; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 2px; font-weight: bold; }

        /* Панель профиля */
        .profile { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .avatar { width: 36px; height: 36px; background: #333; border-radius: 50%; border: 2px solid #0066ff; }

        /* Навигация (Кнопки слева) */
        .nav-menu { display: flex; flex-direction: column; gap: 12px; width: 260px; margin-top: auto; margin-bottom: auto; }
        .menu-btn {
            background: rgba(20, 20, 25, 0.6); border: 1px solid rgba(255,255,255,0.1); color: #ccc;
            padding: 14px 20px; font-size: 16px; font-weight: 600; text-align: left; cursor: pointer;
            transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px;
        }
        .menu-btn:hover { background: rgba(255,255,255,0.1); color: #fff; border-left: 4px solid #0066ff; padding-left: 24px; }
        .menu-btn.primary { background: #0066ff; color: #fff; border: none; text-align: center; font-size: 18px; margin-top: 10px; }
        .menu-btn.primary:hover { background: #0055cc; padding-left: 20px; box-shadow: 0 0 15px rgba(0,102,255,0.5); }

        /* Футер */
        .footer { display: flex; justify-content: space-between; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="menu-overlay">
        <!-- Верхняя часть -->
        <div class="header">
            <div class="title-group">
                <span class="badge">HARDPOINT</span>
                <h1>Тестирование TTK</h1>
            </div>
            <div class="profile">
                <div class="avatar"></div>
                <div>
                    <div style="font-weight: bold; font-size: 14px;">Оперативник</div>
                    <div style="font-size: 11px; color: #aaa;">Уровень 1</div>
                </div>
            </div>
        </div>

        <!-- Кнопки выбора -->
        <div class="nav-menu">
            <button class="menu-btn primary" onclick="alert('Запуск боя...')">В БОЙ [DEPLOY]</button>
            <button class="menu-btn">Оружие / Экипировка</button>
            <button class="menu-btn">Операторы</button>
            <button class="menu-btn">Настройки</button>
        </div>

        <!-- Нижняя часть -->
        <div class="footer">
            <div>Версия: 0.4.2 | Sable Digital Studio</div>
            <div>[P] Камера шлема | [C] Приседание</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 3D Анимированный фон (Оружие на стойке в стиле TTK)
        let scene, camera, renderer, weaponGroup;

        function initMenuBackground() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x08080a);
            scene.fog = new THREE.FogExp2(0x08080a, 0.05);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Освещение (Студийный свет для оружия)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const blueLight = new THREE.PointLight(0x0066ff, 2, 10);
            blueLight.position.set(-2, 1, 2);
            scene.add(blueLight);

            const topLight = new THREE.DirectionalLight(0xffffff, 0.8);
            topLight.position.set(0, 5, 2);
            scene.add(topLight);

            // 3D Модель оружия для фонового меню
            weaponGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(1.5, 0.25, 0.15);
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.4, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, darkMat);
            weaponGroup.add(body);

            const magGeo = new THREE.BoxGeometry(0.2, 0.6, 0.12);
            const mag = new THREE.Mesh(magGeo, darkMat);
            mag.position.set(-0.2, -0.35, 0);
            mag.rotation.z = -0.2;
            weaponGroup.add(mag);

            const sightGeo = new THREE.BoxGeometry(0.3, 0.15, 0.1);
            const sightMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.2 });
            const sight = new THREE.Mesh(sightGeo, sightMat);
            sight.position.set(0, 0.2, 0);
            weaponGroup.add(sight);

            weaponGroup.position.set(0.6, -0.1, 0);
            weaponGroup.rotation.y = -0.5;
            scene.add(weaponGroup);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Медленное вращение оружия в меню
            if (weaponGroup) {
                weaponGroup.rotation.y = -0.5 + Math.sin(Date.now() * 0.0008) * 0.08;
                weaponGroup.position.y = -0.1 + Math.cos(Date.now() * 0.001) * 0.02;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = initMenuBackground;
    </script>
</body>
</html>
