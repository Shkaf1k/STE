<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TTK - Roblox Style FPS</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: Segoe UI, sans-serif; user-select: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Прицел */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: rgba(255,255,255,0.7); transform: translate(-50%, -50%); border-radius: 50%; }
        
        /* HUD в стиле TTK */
        #hud { position: absolute; bottom: 30px; left: 30px; color: #fff; text-shadow: 1px 1px 3px #000; }
        .mode-tag { background: #0088ff; padding: 2px 8px; font-weight: bold; font-size: 12px; border-radius: 3px; display: inline-block; margin-bottom: 5px; }
        
        /* Маска камеры шлема */
        #helmet-cam { position: absolute; top:0; left:0; width:100%; height:100%; box-shadow: inset 0 0 150px rgba(0,0,0,0.9); display: none; pointer-events: none; }
        
        #start-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(15,15,20,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; cursor: pointer; }
        #start-screen h1 { margin: 0; font-size: 36px; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="crosshair"></div>
        <div id="helmet-cam"></div>
        <div id="hud">
            <div class="mode-tag">HARDPOINT / FFA</div>
            <div style="font-size: 22px; font-weight: bold;">Здоровье: <span id="hp">100</span></div>
            <div style="font-size: 16px; color: #aaa;">Патроны: <span id="ammo">30</span> / 30</div>
            <div style="font-size: 12px; margin-top: 10px; color: #888;">
                [M1] Огонь | [M2] Прицел | [Q/E] Наклон | [C] Присесть | [P] Камера шлема | [R] Перезарядка
            </div>
        </div>
    </div>

    <div id="start-screen">
        <h1>Тестирование TTK</h1>
        <p style="color: #888;">Нажмите в любом месте для начала</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let isLocked = false, isAiming = false, isCrouching = false, helmetCam = false;
        let pitch = 0, yaw = 0, lean = 0;
        let ammo = 30, hp = 100;
        let weapon, normalFov = 75, aimFov = 45;

        const moveState = { w: false, a: false, s: false, d: false, q: false, e: false };
        const enemies = [];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0c);
            scene.fog = new THREE.FogExp2(0x0a0a0c, 0.04);

            camera = new THREE.PerspectiveCamera(normalFov, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Свет
            scene.add(new THREE.AmbientLight(0x333344));
            const light = new THREE.DirectionalLight(0xffffff, 0.5);
            light.position.set(10, 20, 10);
            scene.add(light);

            createTacticalMap();
            createWeapon();
            spawnTargets();

            setupInputs();
            animate();
        }

        function createTacticalMap() {
            // Пол
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(80, 80),
                new THREE.MeshStandardMaterial({ color: 0x1a1a20, roughness: 0.9 })
            );
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Укрытия и двери (как в CQB/Hardpoint)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a2a35 });
            const objects = [
                [0, 1.5, -8, 4, 3, 0.5], [-4, 1.5, -5, 0.5, 3, 4], 
                [5, 1.5, -12, 6, 3, 0.5], [-8, 1.5, -15, 0.5, 3, 8]
            ];
            objects.forEach(o => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(o[3], o[4], o[5]), wallMat);
                wall.position.set(o[0], o[1], o[2]);
                scene.add(wall);
            });
        }

        function createWeapon() {
            weapon = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(0.08, 0.1, 0.5),
                new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 })
            );
            weapon.add(body);
            weapon.position.set(0.2, -0.2, -0.4);
            camera.add(weapon);
            scene.add(camera);
        }

        function spawnTargets() {
            const targetGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.7, 12);
            const targetMat = new THREE.MeshStandardMaterial({ color: 0xa33333 });
            for(let i = 0; i < 4; i++) {
                const target = new THREE.Mesh(targetGeo, targetMat);
                target.position.set((Math.random() - 0.5) * 20, 0.85, -5 - Math.random() * 15);
                scene.add(target);
                enemies.push(target);
            }
        }

        function setupInputs() {
            const startScreen = document.getElementById('start-screen');
            startScreen.addEventListener('click', () => document.body.requestPointerLock());

            document.addEventListener('pointerlockchange', () => {
                isLocked = document.pointerLockElement === document.body;
                startScreen.style.display = isLocked ? 'none' : 'flex';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isLocked) return;
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-1.4, Math.min(1.4, pitch));
            });

            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveState.w = true;
                if (e.code === 'KeyS') moveState.s = true;
                if (e.code === 'KeyA') moveState.a = true;
                if (e.code === 'KeyD') moveState.d = true;
                if (e.code === 'KeyQ') moveState.q = true;
                if (e.code === 'KeyE') moveState.e = true;
                if (e.code === 'KeyC') isCrouching = !isCrouching;
                if (e.code === 'KeyP') {
                    helmetCam = !helmetCam;
                    document.getElementById('helmet-cam').style.display = helmetCam ? 'block' : 'none';
                }
                if (e.code === 'KeyR') ammo = 30;
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveState.w = false;
                if (e.code === 'KeyS') moveState.s = false;
                if (e.code === 'KeyA') moveState.a = false;
                if (e.code === 'KeyD') moveState.d = false;
                if (e.code === 'KeyQ') moveState.q = false;
                if (e.code === 'KeyE') moveState.e = false;
            });

            document.addEventListener('mousedown', (e) => {
                if (!isLocked) return;
                if (e.button === 0) shoot();
                if (e.button === 2) isAiming = true;
            });

            document.addEventListener('mouseup', (e) => {
                if (e.button === 2) isAiming = false;
            });

            window.addEventListener('contextmenu', e => e.preventDefault());
        }

        function shoot() {
            if (ammo <= 0) return;
            ammo--;
            document.getElementById('ammo').textContent = ammo;

            weapon.position.z += 0.04; // Отдача

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = raycaster.intersectObjects(enemies);

            if (hits.length > 0) {
                const enemy = hits[0].object;
                enemy.material.color.setHex(0xffffff);
                setTimeout(() => enemy.material.color.setHex(0xa33333), 50);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isLocked) {
                // Высота камеры (приседание)
                const targetY = isCrouching ? 1.0 : 1.6;
                camera.position.y += (targetY - camera.position.y) * 0.1;

                // Наклон (Lean Q/E)
                let targetLean = 0;
                if (moveState.q) targetLean = 0.2;
                if (moveState.e) targetLean = -0.2;
                lean += (targetLean - lean) * 0.1;

                // Поворот камеры
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
                camera.rotation.z = lean;

                // Движение
                const speed = isCrouching ? 0.04 : 0.08;
                if (moveState.w) camera.translateZ(-speed);
                if (moveState.s) camera.translateZ(speed);
                if (moveState.a) camera.translateX(-speed);
                if (moveState.d) camera.translateX(speed);

                // Прицеливание (ADS)
                const targetFov = isAiming ? aimFov : normalFov;
                camera.fov += (targetFov - camera.fov) * 0.1;
                camera.updateProjectionMatrix();

                const targetGunPos = isAiming ? new THREE.Vector3(0, -0.1, -0.25) : new THREE.Vector3(0.2, -0.2, -0.4);
                weapon.position.lerp(targetGunPos, 0.15);
            }

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
