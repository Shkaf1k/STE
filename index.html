<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDUSTRIAL_ANOMALY // 0x4E</title>
    <style>
        /* Стилізація у похмурому індустріальному стилі (Mike Klubnika / Buckshot Roulette aesthetic) */
        :root {
            --bg-color: #0c0c0e;
            --panel-color: #141418;
            --border-color: #2b2b36;
            --text-main: #a0a0b0;
            --text-dim: #505060;
            --accent-red: #8b0000;
            --accent-rust: #b54a2b;
            --glow-green: #33ff66;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #050507;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
        }

        /* Ефекти кіноплівки та CRT сканів */
        #game-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        #game-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.05;
            pointer-events: none;
            z-index: 11;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%\" height="100%" filter="url(%23noiseFilter)"/></svg>');
        }

        canvas {
            display: block;
            background-color: #08080a;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 12, 0.95);
            z-index: 20;
            padding: 40px;
        }

        .hidden {
            display: none !important;
        }

        h1, h2 {
            font-family: 'Courier New', Courier, monospace;
            color: var(--accent-rust);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0px rgba(139, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        p {
            color: var(--text-dim);
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn {
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 24px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-rust);
            color: #fff;
            border-color: var(--accent-rust);
            box-shadow: 0 0 10px rgba(181, 74, 43, 0.5);
        }

        /* Термінал сповіщень про досягнення */
        #achievement-popup {
            position: absolute;
            bottom: 20px;
            right: -300px;
            width: 280px;
            background: var(--panel-color);
            border-left: 4px solid var(--accent-rust);
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 12px;
            z-index: 30;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: -5px 5px 15px rgba(0,0,0,0.8);
        }

        #achievement-popup.show {
            right: 20px;
        }

        #achievement-popup h4 {
            margin: 0 0 5px 0;
            color: var(--accent-rust);
            font-size: 12px;
            letter-spacing: 1px;
        }

        #achievement-popup p {
            margin: 0;
            color: var(--text-main);
            font-size: 11px;
            text-align: left;
        }

        /* Магазин та інтерфейс хвилі */
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .shop-item {
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .shop-item:hover {
            border-color: var(--accent-rust);
        }

        .shop-item h3 {
            font-size: 14px;
            margin: 0 0 5px 0;
            color: var(--text-main);
        }

        .shop-item span {
            font-size: 12px;
            color: var(--accent-rust);
        }

        /* Список досягнень */
        .achievements-list {
            width: 100%;
            max-width: 600px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.4);
            margin-bottom: 20px;
            padding: 10px;
        }

        .ach-row {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px dashed var(--border-color);
            font-size: 12px;
        }

        .ach-row.unlocked {
            color: var(--glow-green);
        }
        .ach-row.locked {
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- ГОЛОВНЕ МЕНЮ -->
    <div id="main-menu" class="screen">
        <h1>INDUSTRIAL ANOMALY</h1>
        <p>SYSTEM PROTOCOL: 0x4E // SURVIVE THE CONTAMINATION</p>
        <button class="btn" onclick="Game.start()">[ ПОЧАТИ ПРОТОКОЛ ]</button>
        <button class="btn" onclick="UI.showScreen('achievements-screen')">[ СИСТЕМНІ АЧИВКИ ]</button>
        <button class="btn" onclick="UI.showScreen('settings-screen')">[ НАЛАШТУВАННЯ ]</button>
    </div>

    <!-- ЕКРАН НАЛАШТУВАНЬ -->
    <div id="settings-screen" class="screen hidden">
        <h2>НАЛАШТУВАННЯ</h2>
        <p>РЕЖИМ СТРІЛЬБИ: <span id="setting-fire-mode">АВТОМАТИЧНИЙ</span></p>
        <button class="btn" onclick="Settings.toggleFireMode()">ЗМІНИТЬ РЕЖИМ СТРІЛЬБИ</button>
        <button class="btn" onclick="UI.showScreen('main-menu')">[ НАЗАД ]</button>
    </div>

    <!-- ЕКРАН АЧИВОК -->
    <div id="achievements-screen" class="screen hidden">
        <h2>ЖУРНАЛ ДОСЯГНЕНЬ</h2>
        <div class="achievements-list" id="achievements-container">
            <!-- Заповнюється через JS -->
        </div>
        <button class="btn" onclick="UI.showScreen('main-menu')">[ НАЗАД ]</button>
    </div>

    <!-- МАГАЗИН МІЖ ХВИЛЯМИ -->
    <div id="shop-screen" class="screen hidden">
        <h2 id="shop-title">СЕКТОР ОЧИЩЕНО</h2>
        <p>ІНСТРУМЕНТИ МОДЕРНІЗАЦІЇ. ФРАГМЕНТИ РЕСУРСІВ: <span id="shop-scrap" style="color:var(--glow-green)">0</span></p>
        <div class="shop-grid" id="shop-items-container">
            <!-- Динамічні апгрейди -->
        </div>
        <button class="btn" onclick="Game.nextWave()">[ ПОЧАТИ НАСТУПНУ ХВИЛЮ ]</button>
    </div>

    <!-- ЕКРАН СМЕРТІ -->
    <div id="gameover-screen" class="screen hidden">
        <h1 style="color: var(--accent-red);">ЗБОЇ СИСТЕМИ // СМЕРТЬ</h1>
        <p id="gameover-stats">ВИ ПРОТРИМАЛИСЬ ХВИЛЬ: 0</p>
        <button class="btn" onclick="Game.restart()">[ ПЕРЕЗАПУСТИТИ ]</button>
        <button class="btn" onclick="UI.showScreen('main-menu')">[ ГОЛОВНЕ МЕНЮ ]</button>
    </div>

    <!-- ІГРОВИЙ CANVAS -->
    <canvas id="canvas" width="800" height="600" class="hidden"></canvas>

    <!-- Спливаюче вікно ачивок -->
    <div id="achievement-popup">
        <h4 id="popup-title">ТЕРМІНАЛ: АЧИВКА</h4>
        <p id="popup-text">Опис досягнення...</p>
    </div>
</div>

<script>
    /* --- ЗВУКОВИЙ МОДУЛЬ (WEB AUDIO API) --- */
    const AudioSys = {
        ctx: null,
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        },
        playTone(freq, type, duration, vol = 0.1) {
            if (!this.ctx) return;
            try {
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch(e) {}
        },
        shoot() { this.playTone(120, 'sawtooth', 0.1, 0.08); },
        hit() { this.playTone(60, 'square', 0.15, 0.1); },
        buy() { this.playTone(400, 'sine', 0.2, 0.1); },
        achievement() {
            this.playTone(523.25, 'sine', 0.1, 0.1);
            setTimeout(() => this.playTone(659.25, 'sine', 0.2, 0.1), 100);
        }
    };

    /* --- СИСТЕМА ЗБЕРЕЖЕННЯ ТА ДОСЯГНЕНЬ --- */
    const Storage = {
        data: {
            bestWave: 0,
            scrap: 0,
            achievements: {}
        },
        load() {
            let saved = localStorage.getItem('IND_ANOMALY_SAVE');
            if (saved) {
                try { this.data = JSON.parse(saved); } catch(e) {}
            }
        },
        save() {
            localStorage.setItem('IND_ANOMALY_SAVE', JSON.stringify(this.data));
        },
        unlock(id, title, desc) {
            if (!this.data.achievements[id]) {
                this.data.achievements[id] = true;
                this.save();
                AudioSys.achievement();
                UI.showAchievementPopup(title, desc);
                UI.updateAchievementsList();
            }
        }
    };

    const AchievementsDef = {
        first_blood: { title: "ПЕРША КРОВ", desc: "Знищіть першу аномалію." },
        wave_3: { title: "ІНДУСТРІАЛЬНИЙ ЖАХ", desc: "Доживіть до 3-ї хвилі." },
        wave_5: { title: "ГЛИБОКИЙ ШАТХАУТ", desc: "Доживіть до 5-ї хвилі." },
        rich: { title: "МАРОДЕР", desc: "Накопичте 100 одиниць металобрухту." },
        speed_demon: { title: "ПЕРЕГРІВ", desc: "Купіть апгрейд швидкості." }
    };

    /* --- НАЛАШТУВАННЯ --- */
    const Settings = {
        autoFire: true,
        toggleFireMode() {
            this.autoFire = !this.autoFire;
            document.getElementById('setting-fire-mode').innerText = this.autoFire ? "АВТОМАТИЧНИЙ" : "РУЧНИЙ (КЛІК)";
        }
    };

    /* --- ІНТЕРФЕЙС КОРИСТУВАЧА --- */
    const UI = {
        showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('canvas').classList.add('hidden');
            if(id === 'canvas') {
                document.getElementById('canvas').classList.remove('hidden');
            } else {
                document.getElementById(id).classList.remove('hidden');
            }
        },
        showAchievementPopup(title, desc) {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-text').innerText = desc;
            let pop = document.getElementById('achievement-popup');
            pop.classList.add('show');
            setTimeout(() => pop.classList.remove('show'), 3500);
        },
        updateAchievementsList() {
            let container = document.getElementById('achievements-container');
            container.innerHTML = '';
            for (let id in AchievementsDef) {
                let unlocked = Storage.data.achievements[id];
                let def = AchievementsDef[id];
                let div = document.createElement('div');
                div.className = `ach-row ${unlocked ? 'unlocked' : 'locked'}`;
                div.innerHTML = `<span>[${unlocked ? 'АКТИВНО' : 'ЗАБЛОКОВАНО'}] ${def.title}</span> <span>${def.desc}</span>`;
                container.appendChild(div);
            }
        }
    };

    /* --- ІГРОВИЙ РУШИЙ ТА ЛОГІКА --- */
    const Game = {
        canvas: null,
        ctx: null,
        keys: {},
        mouse: { x: 0, y: 0, down: false },
        player: {
            x: 400, y: 300, radius: 12, speed: 3, hp: 100, maxHp: 100,
            regen: 0, critChance: 0.05, damageMult: 1
        },
        weapons: [
            { name: "Іржавий пістолет", fireRate: 15, damage: 15, bulletSpeed: 8, range: 400, unlocked: true },
            { name: "Циркулярна пилка", fireRate: 8, damage: 8, bulletSpeed: 10, range: 250, unlocked: false },
            { name: "Тяжкий дробовик", fireRate: 45, damage: 40, bulletSpeed: 7, range: 300, unlocked: false },
            { name: "Експериментальний лазер", fireRate: 3, damage: 4, bulletSpeed: 15, range: 600, unlocked: false }
        ],
        currentWeaponIndex: 0,
        bullets: [],
        enemies: [],
        particles: [],
        wave: 1,
        waveTimer: 0,
        waveDuration: 1800, // 30 секунд при 60fps
        spawnTimer: 0,
        scrap: 0,
        running: false,
        lastShot: 0,

        start() {
            AudioSys.init();
            Storage.load();
            this.scrap = Storage.data.scrap;
            this.wave = 1;
            this.player.hp = this.player.maxHp = 100;
            this.player.x = 400;
            this.player.y = 300;
            this.bullets = [];
            this.enemies = [];
            this.particles = [];
            
            UI.showScreen('canvas');
            this.canvas = document.getElementById('canvas');
            this.ctx = this.canvas.getContext('2d');
            
            this.setupListeners();
            this.running = true;
            this.loop();
        },

        restart() {
            this.start();
        },

        setupListeners() {
            window.onkeydown = e => this.keys[e.key.toLowerCase()] = true;
            window.onkeyup = e => this.keys[e.key.toLowerCase()] = false;
            this.canvas.onmousemove = e => {
                let rect = this.canvas.getBoundingClientRect();
                this.mouse.x = e.clientX - rect.left;
                this.mouse.y = e.clientY - rect.top;
            };
            this.canvas.onmousedown = () => this.mouse.down = true;
            this.canvas.onmouseup = () => this.mouse.down = false;
        },

        nextWave() {
            this.wave++;
            this.waveTimer = 0;
            UI.showScreen('canvas');
            this.running = true;
            this.loop();
        },

        endWave() {
            this.running = false;
            Storage.data.scrap += this.scrap;
            Storage.save();
            
            if (this.wave >= 3) Storage.unlock('wave_3', AchievementsDef.wave_3.title, AchievementsDef.wave_3.desc);
            if (this.wave >= 5) Storage.unlock('wave_5', AchievementsDef.wave_5.title, AchievementsDef.wave_5.desc);
            if (Storage.data.scrap >= 100) Storage.unlock('rich', AchievementsDef.rich.title, AchievementsDef.rich.desc);

            this.openShop();
        },

        openShop() {
            UI.showScreen('shop-screen');
            document.getElementById('shop-scrap').innerText = this.scrap;
            let container = document.getElementById('shop-items-container');
            container.innerHTML = `
                <div class="shop-item" onclick="Game.buyUpgrade('speed')">
                    <h3>Іржавий протез</h3>
                    <p>+0.5 до швидкості пересування</p>
                    <span>ВАРТІСТЬ: 15 брухту</span>
                </div>
                <div class="shop-item" onclick="Game.buyUpgrade('regen')">
                    <h3>Машинне мастило</h3>
                    <p>Регенерація здоров'я</p>
                    <span>ВАРТІСТЬ: 20 брухту</span>
                </div>
                <div class="shop-item" onclick="Game.buyUpgrade('heal')">
                    <h3>Аварійний ремонт</h3>
                    <p>Відновити 50 HP</p>
                    <span>ВАРТІСТЬ: 10 брухту</span>
                </div>
                <div class="shop-item" onclick="Game.buyUpgrade('damage')">
                    <h3>Розгін боєприпасів</h3>
                    <p>+20% до шкоди</p>
                    <span>ВАРТІСТЬ: 25 брухту</span>
                </div>
            `;
        },

        buyUpgrade(type) {
            if (type === 'speed' && this.scrap >= 15) {
                this.scrap -= 15;
                this.player.speed += 0.5;
                AudioSys.buy();
                Storage.unlock('speed_demon', AchievementsDef.speed_demon.title, AchievementsDef.speed_demon.desc);
            } else if (type === 'regen' && this.scrap >= 20) {
                this.scrap -= 20;
                this.player.regen += 0.05;
                AudioSys.buy();
            } else if (type === 'heal' && this.scrap >= 10) {
                this.scrap -= 10;
                this.player.hp = Math.min(this.player.maxHp, this.player.hp + 50);
                AudioSys.buy();
            } else if (type === 'damage' && this.scrap >= 25) {
                this.scrap -= 25;
                this.player.damageMult += 0.2;
                AudioSys.buy();
            }
            document.getElementById('shop-scrap').innerText = this.scrap;
        },

        gameOver() {
            this.running = false;
            Storage.data.scrap += this.scrap;
            Storage.save();
            UI.showScreen('gameover-screen');
            document.getElementById('gameover-stats').innerText = `ВИ ПРОТРИМАЛИСЬ ХВИЛЬ: ${this.wave}`;
        },

        update() {
            // Рух гравця (WASD)
            let dx = 0, dy = 0;
            if (this.keys['w'] || this.keys['ц']) dy = -1;
            if (this.keys['s'] || this.keys['і']) dy = 1;
            if (this.keys['a'] || this.keys['ф']) dx = -1;
            if (this.keys['d'] || this.keys['в']) dx = 1;
            
            if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
            this.player.x += dx * this.player.speed;
            this.player.y += dy * this.player.speed;

            // Обмеження ареною
            this.player.x = Math.max(20, Math.min(780, this.player.x));
            this.player.y = Math.max(20, Math.min(580, this.player.y));

            // Регенерація
            if (this.player.regen > 0 && this.player.hp < this.player.maxHp) {
                this.player.hp += this.player.regen;
            }

            // Стрільба
            this.lastShot++;
            let weapon = this.weapons[this.currentWeaponIndex];
            if ((Settings.autoFire || this.mouse.down) && this.lastShot >= weapon.fireRate) {
                this.lastShot = 0;
                AudioSys.shoot();
                let angle = Math.atan2(this.mouse.y - this.player.y, this.mouse.x - this.player.x);
                this.bullets.push({
                    x: this.player.x, y: this.player.y,
                    vx: Math.cos(angle) * weapon.bulletSpeed,
                    vy: Math.sin(angle) * weapon.bulletSpeed,
                    damage: weapon.damage * this.player.damageMult,
                    range: weapon.range, distTraveled: 0
                });
            }

            // Оновлення куль
            for (let i = this.bullets.length - 1; i >= 0; i--) {
                let b = this.bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.distTraveled += Math.hypot(b.vx, b.vy);
                if (b.distTraveled > b.range || b.x < 0 || b.x > 800 || b.y < 0 || b.y > 600) {
                    this.bullets.splice(i, 1);
                }
            }

            // Спавн ворогів
            this.waveTimer++;
            this.spawnTimer++;
            if (this.spawnTimer > Math.max(20, 60 - this.wave * 5)) {
                this.spawnTimer = 0;
                this.spawnEnemy();
            }

            if (this.waveTimer >= this.waveDuration) {
                this.endWave();
                return;
            }

            // Оновлення ворогів
            for (let i = this.enemies.length - 1; i >= 0; i--) {
                let en = this.enemies[i];
                let angle = Math.atan2(this.player.y - en.y, this.player.x - en.x);
                en.x += Math.cos(angle) * en.speed;
                en.y += Math.sin(angle) * en.speed;

                // Зіткнення з гравцем
                let dist = Math.hypot(this.player.x - en.x, this.player.y - en.y);
                if (dist < this.player.radius + en.radius) {
                    this.player.hp -= en.damage;
                    AudioSys.hit();
                    if (this.player.hp <= 0) {
                        this.gameOver();
                        return;
                    }
                }

                // Зіткнення з кулями
                for (let j = this.bullets.length - 1; j >= 0; j--) {
                    let b = this.bullets[j];
                    if (Math.hypot(b.x - en.x, b.y - en.y) < en.radius) {
                        en.hp -= b.damage;
                        this.bullets.splice(j, 1);
                        if (en.hp <= 0) {
                            Storage.unlock('first_blood', AchievementsDef.first_blood.title, AchievementsDef.first_blood.desc);
                            this.scrap += en.scrapValue;
                            this.enemies.splice(i, 1);
                            break;
                        }
                    }
                }
            }
        },

        spawnEnemy() {
            let types = [
                { radius: 10, speed: 2.2, hp: 20, damage: 0.5, color: '#b54a2b', scrapValue: 2 }, // Мех-істота
                { radius: 14, speed: 1.4, hp: 50, damage: 1.0, color: '#505060', scrapValue: 4 }, // Робітник-привид
                { radius: 8, speed: 3.0, hp: 10, damage: 0.3, color: '#8b0000', scrapValue: 1 },  // Тіньова сутність
                { radius: 20, speed: 0.8, hp: 100, damage: 2.0, color: '#2b2b36', scrapValue: 8 } // Аномальний важкий маніпулятор
            ];
            let type = types[Math.floor(Math.random() * Math.min(types.length, 1 + Math.floor(this.wave / 2)))];
            
            let edge = Math.floor(Math.random() * 4);
            let x, y;
            if (edge === 0) { x = Math.random() * 800; y = -20; }
            else if (edge === 1) { x = 820; y = Math.random() * 600; }
            else if (edge === 2) { x = Math.random() * 800; y = 620; }
            else { x = -20; y = Math.random() * 600; }

            this.enemies.push({ x, y, ...type });
        },

        render() {
            this.ctx.fillStyle = '#08080a';
            this.ctx.fillRect(0, 0, 800, 600);

            // Сітка арени у промисловому стилі
            this.ctx.strokeStyle = '#141418';
            this.ctx.lineWidth = 1;
            for(let x=0; x<800; x+=40) {
                this.ctx.beginPath(); this.ctx.moveTo(x, 0); this.ctx.lineTo(x, 600); this.ctx.stroke();
            }
            for(let y=0; y<600; y+=40) {
                this.ctx.beginPath(); this.ctx.moveTo(0, y); this.ctx.lineTo(800, y); this.ctx.stroke();
            }

            // Малювання ворогів
            for (let en of this.enemies) {
                this.ctx.fillStyle = en.color;
                this.ctx.beginPath();
                this.ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.strokeStyle = '#000';
                this.ctx.stroke();
            }

            // Малювання куль
            this.ctx.fillStyle = '#ff3333';
            for (let b of this.bullets) {
                this.ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
            }

            // Малювання гравця
            this.ctx.fillStyle = '#a0a0b0';
            this.ctx.beginPath();
            this.ctx.arc(this.player.x, this.player.y, this.player.radius, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.strokeStyle = '#b54a2b';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();

            // HUD інтерфейс на екрані гри
            this.ctx.fillStyle = '#a0a0b0';
            this.ctx.font = '14px "Courier New"';
            this.ctx.fillText(`ЗДОРОВ'Я: ${Math.ceil(this.player.hp)}/${this.player.maxHp}`, 20, 30);
            this.ctx.fillText(`БРУХТ: ${this.scrap}`, 20, 55);
            this.ctx.fillText(`ХВИЛЯ: ${this.wave}`, 700, 30);
            this.ctx.fillText(`ЧАС: ${Math.ceil((this.waveDuration - this.waveTimer) / 60)}с`, 700, 55);

            // Шкала здоров'я
            this.ctx.fillStyle = '#2b2b36';
            this.ctx.fillRect(20, 70, 150, 8);
            this.ctx.fillStyle = '#8b0000';
            this.ctx.fillRect(20, 70, 150 * (this.player.hp / this.player.maxHp), 8);
        },

        loop() {
            if (!this.running) return;
            this.update();
            this.render();
            requestAnimationFrame(() => this.loop());
        }
    };

    // Початкове завантаження списку ачивок для меню
    Storage.load();
    UI.updateAchievementsList();
</script>
