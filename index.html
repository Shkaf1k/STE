<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Community // Аналог</title>
    <style>
        /* Сброс и базовые стили Steam */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Motiva Sans", Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #1b2838;
            color: #c6d4df;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* Шапка */
        header {
            width: 100%;
            background-color: #171a21;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        header h1 {
            color: #fff;
            font-size: 22px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Основной контейнер профиля */
        .profile-container {
            width: 950px;
            background: linear-gradient(to bottom, rgba(32,45,61,0.9) 0%, rgba(16,24,34,0.95) 100%);
            border: 1px solid #2a475e;
            border-radius: 4px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Верхняя часть профиля */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #2a475e;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            border: 2px solid #54a5d4;
        }

        .profile-info {
            flex-grow: 1;
        }

        .username {
            font-size: 26px;
            color: #ffffff;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .bio {
            font-size: 13px;
            color: #8f98a0;
            margin-bottom: 10px;
        }

        /* Блок уровня */
        .level-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .level-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #4c6b22;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background-color: #2a475e;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .level-text {
            font-size: 12px;
            color: #8f98a0;
            margin-top: 5px;
        }

        /* Прогресс бар уровня */
        .xp-bar-container {
            width: 100%;
            background-color: #101822;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #2a475e;
            margin-top: 15px;
        }

        .xp-bar-fill {
            height: 100%;
            width: 30%;
            background: linear-gradient(to right, #47bfff, #1a9fff);
            transition: width 0.4s ease;
        }

        /* Панель управления (Кнопки) */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            background: linear-gradient(to right, #47bfff 0%, #1a9fff 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 2px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: filter 0.2s;
        }

        .btn:hover {
            filter: brightness(1.2);
        }

        .btn-craft {
            background: linear-gradient(to right, #5c7e10 0%, #4c6b22 100%);
        }

        /* Инвентарь с карточками */
        .section-title {
            font-size: 18px;
            color: #fff;
            margin-bottom: 15px;
            border-bottom: 1px solid #2a475e;
            padding-bottom: 5px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
        }

        .card-item {
            background: #101822;
            border: 1px solid #2a475e;
            border-radius: 4px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card-item:hover {
            transform: translateY(-5px);
            border-color: #66c0f4;
        }

        .card-img {
            width: 100%;
            height: 120px;
            background-color: #1b2838;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 12px;
            color: #c6d4df;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Уведомление */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #2a475e;
            color: #fff;
            padding: 15px 25px;
            border-left: 4px solid #66c0f4;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: none;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>STEAM COMMUNITY // TEST ENGINE</h1>
    </header>

    <div class="profile-container">
        <!-- Шапка профиля -->
        <div class="profile-header">
            <div class="avatar-container">
                <img class="avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=SteamUser" alt="Avatar">
            </div>
            
            <div class="profile-info">
                <div class="username" id="username">Player_1337</div>
                <div class="bio">Геймер, разработчик и коллекционер карточек. Добро пожаловать!</div>
                
                <!-- Прогресс XP -->
                <div style="font-size: 12px; color: #8f98a0; display: flex; justify-content: space-between;">
                    <span>Прогресс уровня</span>
                    <span id="xp-text">30 / 100 XP</span>
                </div>
                <div class="xp-bar-container">
                    <div class="xp-bar-fill" id="xp-fill"></div>
                </div>
            </div>

            <div class="level-container">
                <div class="level-badge" id="level-badge">1</div>
                <div class="level-text">Уровень Steam</div>
            </div>
        </div>

        <!-- Кнопки управления -->
        <div class="controls">
            <button class="btn" onclick="addXP(40)">+40 XP (Играть в игру)</button>
            <button class="btn btn-craft" onclick="craftBadge()">Скрафтить значок (+100 XP)</button>
        </div>

        <!-- Инвентарь коллекционных карточек -->
        <div class="section-title">Коллекционные карточки (Нажми для просмотра)</div>
        <div class="cards-grid">
            <div class="card-item" onclick="selectCard('Cyberpunk Card #1')">
                <div class="card-img">🤖</div>
                <div class="card-title">Cyber Card #1</div>
            </div>
            <div class="card-item" onclick="selectCard('Fantasy Card #2')">
                <div class="card-img">⚔️</div>
                <div class="card-title">Fantasy Card #2</div>
            </div>
            <div class="card-item" onclick="selectCard('Space Card #3')">
                <div class="card-img">🚀</div>
                <div class="card-title">Space Card #3</div>
            </div>
            <div class="card-item" onclick="selectCard('Retro Card #4')">
                <div class="card-img">👾</div>
                <div class="card-title">Retro Card #4</div>
            </div>
            <div class="card-item" onclick="selectCard('Rare Card #5')">
                <div class="card-img">💎</div>
                <div class="card-title">Rare Card #5</div>
            </div>
        </div>
    </div>

    <!-- Всплывающее уведомление -->
    <div class="toast" id="toast">Сообщение</div>

    <script>
        // Состояние пользователя
        let currentXP = 30;
        let xpToNextLevel = 100;
        let level = 1;

        // Элементы DOM
        const levelBadge = document.getElementById('level-badge');
        const xpText = document.getElementById('xp-text');
        const xpFill = document.getElementById('xp-fill');
        const toast = document.getElementById('toast');

        // Добавление опыта
        function addXP(amount) {
            currentXP += amount;

            // Проверка на получение нового уровня
            while (currentXP >= xpToNextLevel) {
                currentXP -= xpToNextLevel;
                level++;
                showToast(`🎉 ПОЗДРАВЛЯЕМ! Вы получили ${level} уровень Steam!`);
                updateLevelColor();
            }

            updateUI();
        }

        // Обновление интерфейса
        function updateUI() {
            levelBadge.textContent = level;
            xpText.textContent = `${currentXP} / ${xpToNextLevel} XP`;
            const percentage = (currentXP / xpToNextLevel) * 100;
            xpFill.style.width = `${percentage}%`;
        }

        // Изменение цвета значка в зависимости от уровня (как в Steam)
        function updateLevelColor() {
            if (level >= 10) {
                levelBadge.style.borderColor = '#d95b43'; // Красный
            } else if (level >= 5) {
                levelBadge.style.borderColor = '#c0392b'; // Темно-красный
            } else {
                levelBadge.style.borderColor = '#4c6b22'; // Зеленый
            }
        }

        // Крафт значка
        function craftBadge() {
            addXP(100);
            showToast("🛠️ Значок успешно создан! +100 XP");
        }

        // Клик по карточке
        function selectCard(cardName) {
            showToast(`🎴 Вы выбрали карточку: ${cardName}`);
        }

        // Показ уведомлений
        function showToast(message) {
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
